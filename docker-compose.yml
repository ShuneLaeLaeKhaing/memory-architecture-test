name: memory-architecture-test

services:
  postgres:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: memory_architecture
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - memory_pgdata:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6335:6333"
    volumes:
      - memory_qdrantdata:/qdrant/storage

volumes:
  memory_pgdata:
  memory_qdrantdata:
