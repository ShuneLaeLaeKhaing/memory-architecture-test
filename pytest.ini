[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

addopts =
    --verbose
    --tb=short
    --strict-markers
    -ra

markers =
    unit: Unit tests (fast)
    integration: Integration tests (slower)
    slow: Slow tests (require LLM calls)
    skip_ci: Skip in CI (e.g., requires API keys)
